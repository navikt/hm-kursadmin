apiVersion: 'nais.io/v1alpha1'
kind: 'Application'
metadata:
  name: hm-kursadmin-intern
  namespace: teamdigihot
  labels:
    team: teamdigihot
spec:
  image: {{ image }}
  port: 5000
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 90
  accessPolicy:
    outbound:
      rules:
        - application: hm-godkjenningskurs
  vault:
    enabled: false
  ingresses:
    - https://hjelpemidler.intern.dev.nav.no/hjelpemidler/kursadmin
  liveness:
    path: /hjelpemidler/kursadmin/internal/isAlive
    initialDelay: 5
  readiness:
    path: /hjelpemidler/kursadmin/internal/isReady
    initialDelay: 5
  prometheus:
    enabled: true
    path: /hjelpemidler/kursadmin/internal/metrics
  env:
    - name: USE_MSW
      value: 'false'
    - name: GIT_COMMIT
      value: {{ commit }}
    - name: HM_GODKJENNINGSKURS_URL
      value: https://hm-godkjenningskurs.teamdigihot.svc.cluster.local
