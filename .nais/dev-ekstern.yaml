apiVersion: 'nais.io/v1alpha1'
kind: 'Application'
metadata:
  name: hm-kursadmin-ekstern
  namespace: teamdigihot
  labels:
    team: teamdigihot
spec:
  image: {{ image }}
  port: 5000
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 90
  vault:
    enabled: false
  ingresses:
    - https://hotkurs.ekstern.dev.nav.no
  liveness:
    path: /internal/isAlive
    initialDelay: 5
  readiness:
    path: /internal/isReady
    initialDelay: 5
  prometheus:
    enabled: true
    path: /internal/metrics
  env:
    - name: USE_MSW
      value: 'true'
    - name: GIT_COMMIT
      value: {{ commit }}
